<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="多益650">

<title>多益 650 刷題本</title>
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 答案卡概念 — 頂部分頁導覽，內容單欄；閱讀題在寬螢幕改為「文章｜題目」雙欄 */
:root{
  --paper:#f3f5f8; --card:#ffffff; --ink:#15213a; --muted:#5a6479; --line:#dce1ea; --soft:#e9edf4;
  --accent:#2447c9; --accent-soft:#e3e9fb; --lead:#2b3140;
  --ok:#1b7f55; --ok-soft:#dff3ea; --bad:#c23b33; --bad-soft:#fbe5e3; --warn:#a86a12; --warn-soft:#fbf0dc;
  --f-body:"IBM Plex Sans","Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-disp:"Noto Sans TC","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e131b; --card:#161d28; --ink:#e5eaf2; --muted:#9aa4b6; --line:#2a3342; --soft:#1d2533;
  --accent:#86a2ff; --accent-soft:#1f2a47; --lead:#d7dce6;
  --ok:#4cc38f; --ok-soft:#143126; --bad:#f07b72; --bad-soft:#3a1c1b; --warn:#e0a54a; --warn-soft:#352812; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e131b; --card:#161d28; --ink:#e5eaf2; --muted:#9aa4b6; --line:#2a3342; --soft:#1d2533;
  --accent:#86a2ff; --accent-soft:#1f2a47; --lead:#d7dce6;
  --ok:#4cc38f; --ok-soft:#143126; --bad:#f07b72; --bad-soft:#3a1c1b; --warn:#e0a54a; --warn-soft:#352812; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--f-disp);font-weight:900;font-size:18px;letter-spacing:.02em}
.brand b{font-family:var(--f-mono);color:var(--accent);font-size:20px}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.nav button{border:0;background:none;padding:6px 12px;border-radius:999px;font-weight:600;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--paper)}
.nav button:disabled{opacity:.35;cursor:not-allowed}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.cloud i{background:var(--ok)}
.sync.local i{background:var(--ok)}
.sync.none i{background:var(--bad)} .sync.none{color:var(--bad);font-weight:600}
.spk{border:1px solid var(--line);background:var(--card);color:var(--accent);width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;padding:0;flex:none;cursor:pointer;vertical-align:middle}
.spk:hover{border-color:var(--accent);background:var(--accent-soft)}
.spk.sm{width:24px;height:24px;font-size:10px}
.spk.lg{width:44px;height:44px;font-size:16px}
.wcell{display:flex;align-items:center;gap:8px}
tr.playing td{background:var(--accent-soft)}
@media (max-width:640px){
  #vtbl thead{display:none}
  #vtbl, #vtbl tbody, #vtbl tr, #vtbl td{display:block;width:auto}
  #vtbl tr{border-bottom:1px solid var(--line);padding:10px 2px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center}
  #vtbl td{border:0;padding:0}
  #vtbl td:nth-child(1){grid-column:1/3}
  #vtbl td:nth-child(5){grid-column:3;grid-row:1}
  #vtbl td:nth-child(2){grid-column:1;padding-left:38px}
  #vtbl td:nth-child(3){grid-column:2/4;font-weight:600}
  #vtbl td:nth-child(4){grid-column:1/4;padding-left:38px;font-size:14px}
  .spk{width:36px;height:36px}.spk.sm{width:30px;height:30px}
}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:14px}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0}
h1{font-size:26px;font-weight:900}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:820px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
.kpi .v{font-family:var(--f-mono);font-size:28px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:500}
.kpi .l{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.ac{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0e131b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0e131b}}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:grid;grid-template-columns:92px 1fr 64px;gap:10px;align-items:center;font-size:14px}
.track{position:relative;height:12px;background:var(--soft);border-radius:6px}
.fill{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--accent)}
.fill.ok{background:var(--ok)}.fill.warn{background:var(--warn)}.fill.bad{background:var(--bad)}
.target{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
.act{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:110px;padding-top:6px}
.act div{background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.act div.z{background:var(--line);opacity:1}
.act-l{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-size:11px;color:var(--muted);text-align:center;font-family:var(--f-mono)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;font-weight:500}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.field>.lab{font-size:13px;font-weight:700;color:var(--muted)}
.partcard{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px}
.partcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.partcard .en{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
/* 題目畫面 */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:14px}
.prog{flex:1 1 160px;height:6px;background:var(--soft);border-radius:3px;position:relative;min-width:120px}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.qlayout{display:grid;gap:16px}
.qlayout.two{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
@media (max-width:900px){.qlayout.two{grid-template-columns:1fr}}
.passage{white-space:pre-wrap;font-size:14.5px;line-height:1.75;max-height:70vh;overflow:auto;min-width:0}
.qlayout.two .passage-card{position:sticky;top:120px}
@media (max-width:900px){.qlayout.two .passage-card{position:static}.passage{max-height:46vh}}
.blank{display:inline-block;min-width:3.2em;text-align:center;border-bottom:2px solid var(--muted);font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--muted);padding:0 4px}
.blank.cur{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.stem{font-size:18px;line-height:1.65;font-weight:500}
.stem .gap{display:inline-block;min-width:4em;border-bottom:2px solid var(--ink);margin:0 2px}
.word{font-family:var(--f-mono);font-size:34px;font-weight:600;letter-spacing:.01em}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 14px;font-size:15.5px;min-width:0}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt:disabled{cursor:default}
.bub{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--muted);margin-top:-1px}
.opt.sel .bub{background:var(--lead);border-color:var(--lead);color:var(--card)}
.opt.sel{border-color:var(--lead)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.opt span.t{min-width:0;overflow-wrap:anywhere}
.fb{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--f-disp);font-weight:900;font-size:18px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.exp{background:var(--soft);border-radius:8px;padding:12px 14px;font-size:14.5px}
.exp b{font-weight:700}
.zh{white-space:pre-wrap;font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}
.qfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px}
.star{border:0;background:none;font-size:20px;line-height:1;color:var(--muted);padding:4px}
.star[aria-pressed="true"]{color:var(--warn)}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}
/* 模擬考 */
.timer{font-family:var(--f-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;padding:4px 12px;border-radius:8px;background:var(--soft)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.sheet button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px 0;font-family:var(--f-mono);font-size:12px}
.sheet button.done{background:var(--lead);border-color:var(--lead);color:var(--card)}
.sheet button.cur{outline:2px solid var(--accent);outline-offset:1px}
.sheet button.r{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.sheet button.w{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.confirm{border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:12px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* 結果與錯題 */
.score-big{font-family:var(--f-mono);font-size:48px;font-weight:600;line-height:1}
.list{display:flex;flex-direction:column}
.list details{border-top:1px solid var(--line)}
.list details:last-child{border-bottom:1px solid var(--line)}
.list summary{list-style:none;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 4px;cursor:pointer}
.list summary::-webkit-details-marker{display:none}
.list summary .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.list .body{padding:4px 4px 16px;display:flex;flex-direction:column;gap:10px}
.mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.mark.r{background:var(--ok)}.mark.w{background:var(--bad)}.mark.n{background:var(--muted)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700}
input[type=search]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;width:100%;max-width:320px}
.tips li{margin-bottom:6px}
.tips{padding-left:18px;margin:0}
@media (prefers-reduced-motion: no-preference){.fill,.prog i{transition:width .4s ease}.opt{transition:border-color .15s,background .15s}}
</style>

<header class="top"><div class="top-in">
  <div class="brand">多益 <b>650</b> 刷題本</div>
  <span class="sync" id="sync"><i></i><span>讀取進度中…</span></span>
  <nav class="nav" id="nav">
    <button data-tab="home">總覽</button>
    <button data-tab="practice">練習</button>
    <button data-tab="exam">模擬考</button>
    <button data-tab="wrong">錯題本</button>
    <button data-tab="vocab">單字</button>
  </nav>
</div></header>
<main class="wrap" id="view"></main>

<script>
// 題目格式：選項陣列第一個為正解，畫面上會隨機打亂順序
const P5 = [
["The marketing team will ____ the results of the survey at next Monday's meeting.",["present","presents","presented","presenting"],"時態","行銷團隊將在下週一的會議上報告問卷結果。","助動詞 will 後面接原形動詞，所以選 present。"],
["Ms. Chen has worked for the company ____ fifteen years.",["for","since","during","while"],"介系詞","陳小姐已在公司工作十五年。","for + 一段時間（fifteen years）；since 後面要接時間起點（since 2010），while 是連接詞。"],
["All employees are required to submit their expense reports ____ Friday.",["by","until","among","along"],"介系詞","所有員工須在週五前繳交費用報告。","by 表示「在…之前（截止）」，適合一次性的動作；until 表示動作持續到某時間點，不適合 submit。"],
["The new software is ____ easier to use than the previous version.",["much","very","more","most"],"比較級","新軟體比舊版好用得多。","修飾比較級（easier）要用 much / far / even，不能用 very。"],
["Please contact the front desk if you need ____ assistance.",["additional","addition","additionally","add"],"詞性","如需額外協助，請聯絡櫃台。","空格在名詞 assistance 前，需要形容詞 additional（額外的）。"],
["The conference room is not available ____ it is being renovated.",["because","because of","despite","although"],"連接詞","會議室因正在整修而無法使用。","空格後是完整子句（it is being renovated），需要連接詞 because；because of 後面接名詞。語意是因果，不是讓步，所以不選 although。"],
["____ the heavy rain, the outdoor concert was held as scheduled.",["Despite","Although","Because","Even"],"連接詞","儘管下大雨，戶外音樂會仍如期舉行。","空格後是名詞片語（the heavy rain），要用介系詞 Despite；Although 後面要接子句。"],
["Mr. Park asked his assistant to ____ the documents to the client.",["send","sent","sending","sends"],"動詞形式","朴先生請助理把文件寄給客戶。","ask + 人 + to + 原形動詞，所以選 send。"],
["The report ____ by the finance department last week.",["was prepared","prepared","has prepared","is preparing"],"語態","這份報告是上週由財務部準備的。","報告是「被準備」，且有 by 和 last week，要用過去式被動 was prepared。"],
["Our store offers a wide ____ of kitchen appliances.",["selection","select","selective","selected"],"詞性","本店提供種類齊全的廚房家電。","a wide ____ of 中間需要名詞，a wide selection of = 多樣的選擇。"],
["Applicants should have at least three years of ____ in customer service.",["experience","experienced","experiencing","experiences"],"詞性","應徵者應具備至少三年客服經驗。","「工作經驗」的 experience 是不可數名詞；複數 experiences 指「經歷、體驗」。"],
["The manager was impressed by how ____ the new intern completed the project.",["quickly","quick","quickness","quicker"],"詞性","經理對新實習生完成專案的速度印象深刻。","修飾動詞 completed 要用副詞 quickly。"],
["If the shipment ____ late, we will notify you immediately.",["arrives","arrive","will arrive","arrived"],"時態","如果貨物延遲到達，我們會立即通知您。","條件句 if 子句用現在式代替未來式；主詞 shipment 為單數，所以用 arrives。"],
["Neither the director ____ the assistant was available for comment.",["nor","or","and","but"],"連接詞","主任和助理都無法回應。","固定搭配 neither A nor B（A 和 B 都不）。"],
["The hotel provides free shuttle service ____ guests staying more than two nights.",["to","at","with","of"],"介系詞","飯店為住宿超過兩晚的旅客提供免費接駁車。","provide 物 to 人 ＝ provide 人 with 物。這裡是先接物（service），所以用 to。"],
["Ms. Lopez is the person ____ organized the annual charity event.",["who","which","whom","whose"],"關係代名詞","羅培茲小姐就是籌辦年度慈善活動的人。","先行詞是人（the person），且關代在子句中當主詞，所以用 who。"],
["The company ____ its headquarters to Taipei next year.",["will relocate","relocated","has relocated","relocating"],"時態","公司明年將把總部遷到台北。","next year 表示未來，用 will relocate。"],
["Customers ____ purchase more than $100 will receive a free gift.",["who","whose","which","what"],"關係代名詞","消費超過 100 美元的顧客將獲得贈品。","先行詞 customers 是人，關代當主詞，用 who。"],
["The printer on the third floor is out of order, so please use ____ on the second floor.",["the one","it","that","this"],"代名詞","三樓的印表機故障了，請使用二樓那台。","指同類但不同的一個（另一台印表機）用 the one；it 會指同一台。"],
["The training session has been ____ until further notice.",["postponed","postpone","postponing","postpones"],"語態","培訓課程已延期，另行通知。","has been + 過去分詞構成現在完成被動式。"],
["Please read the instructions ____ before assembling the furniture.",["carefully","care","careful","carefulness"],"詞性","組裝家具前請仔細閱讀說明。","修飾動詞 read 用副詞 carefully。"],
["Sales have increased ____ since the new advertising campaign began.",["significantly","significant","significance","signify"],"詞性","自新廣告活動開始以來，銷售額大幅增加。","修飾動詞 increased 用副詞 significantly（顯著地）。"],

["The board meeting has been moved ____ Tuesday to Thursday.",["from","at","on","since"],"介系詞","董事會已從週二改到週四。","from A to B ＝ 從 A 到 B。"],
["Our customer service representatives are available 24 hours a day, seven days a week, ____ holidays.",["including","include","included","inclusive"],"詞性","我們的客服人員全年無休，包括假日。","including 當介系詞用，後面接名詞，意思是「包括」。"],

["Each department ____ responsible for managing its own budget.",["is","are","be","being"],"主詞動詞一致","每個部門都要負責管理自己的預算。","Each + 單數名詞，動詞用單數 is。"],
["Before ____ the meeting, Mr. Chen reviewed the agenda.",["attending","attend","attended","attends"],"動詞形式","出席會議前，陳先生先看過了議程。","介系詞 before 後面接動名詞 attending。"],
["The results of the study will be ____ in next month's issue of the journal.",["published","publishing","publisher","publication"],"語態","研究結果將刊登在下個月的期刊上。","will be + 過去分詞構成未來被動式。"],
["The new policy will take ____ on January 1.",["effect","affect","effective","effectively"],"片語","新政策將於 1 月 1 日生效。","take effect ＝ 生效。affect 是動詞「影響」。"],
["Mr. Garcia is ____ to lead the team because of his extensive experience.",["qualified","qualify","qualification","qualifying"],"詞性","賈西亞先生經驗豐富，有資格帶領團隊。","be qualified to V ＝ 有資格做某事。"],
["Despite the price increase, demand for the product remained ____.",["steady","steadily","steadiness","steadied"],"詞性","儘管漲價，該產品的需求仍保持穩定。","remain 是連綴動詞，後面接形容詞 steady。"],
["Participants are asked to arrive 15 minutes early ____ registration.",["for","to","at","by"],"介系詞","參加者請提早 15 分鐘到場辦理報到。","for 表示目的：為了報到。"],

["Visitors must ____ at the reception desk upon arrival.",["register","registration","registered","registers"],"動詞形式","訪客抵達時須在接待處登記。","助動詞 must 後接原形動詞 register。"],

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LET = 'ABCD';
const LSKEY = 'toeic650-progress';
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pad = n => String(n).padStart(2, '0');
const dayKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fmtTime = s => Math.floor(s / 60) + ':' + pad(s % 60);
const pct = (c, n) => n ? Math.round(c / n * 100) : 0;
const TARGET = 70;
const PARTS = {5:{name:'Part 5',zh:'句子填空',en:'Incomplete Sentences'},6:{name:'Part 6',zh:'段落填空',en:'Text Completion'},7:{name:'Part 7',zh:'閱讀理解',en:'Reading Comprehension'},V:{name:'單字',zh:'核心單字',en:'Vocabulary'}};

// ---------- 題庫 ----------
const Q = [], QM = {}, PASS = {};
P5.forEach((r, i) => { const q = {id:'p5-' + (i + 1), part:5, stem:r[0], opts:r[1], tag:r[2], zh:r[3], exp:r[4]}; Q.push(q); QM[q.id] = q; });
[...P6.map(p => [6, p]), ...P7.map(p => [7, p])].forEach(([part, p]) => {
  PASS[p.id] = p; p.part = part; p.qids = [];
  p.qs.forEach((r, j) => {
    const insert = part === 6 && r[1][0].split(' ').length > 4;
    const q = {id:p.id + '-' + (j + 1), part, pid:p.id, num:j + 1, stem:r[0], opts:r[1], exp:r[2], tag: part === 6 ? (insert ? '句子插入' : '段落填空') : '閱讀理解', insert};
    Q.push(q); QM[q.id] = q; p.qids.push(q.id);
  });
});
VOC.forEach(v => { const q = {id:'v-' + v[0], part:'V', stem:v[0], pos:v[1], ans:v[2], ex:v[3], exzh:v[4], tag:'單字'}; Q.push(q); QM[q.id] = q; });
const byPart = p => Q.filter(q => q.part === p);

// ---------- 進度儲存 ----------
const blank = () => ({v:1, rec:{}, wrong:{}, star:{}, days:{}, exams:[]});
let S = blank();
let dbDoc = null, saveTimer = null, saving = false, pendingSave = false;
const attempts = st => Object.values(st.rec || {}).reduce((a, r) => a + r.n, 0);
function setSync(mode){
  const el = $('#sync'); if (!el) return;
  el.className = 'sync ' + mode;
  el.querySelector('span').textContent = mode === 'cloud' ? '進度已雲端保存' : mode === 'none' ? '此環境無法保存進度' : '進度已存在此瀏覽器';
}
// IndexedDB 備援（localStorage 被清掉或不可用時仍保留紀錄）
const IDB = {
  open(){ return new Promise((res, rej) => { try { const r = indexedDB.open('toeic650', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); },
  async get(k){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); },
  async set(k, v){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
};
let canLS = false, canIDB = false;
function save(){
  try { localStorage.setItem(LSKEY, JSON.stringify(S)); canLS = true; } catch (e) { canLS = false; }
  IDB.set(LSKEY, JSON.stringify(S)).then(() => { canIDB = true; }).catch(() => { canIDB = false; if (!canLS && !dbDoc) setSync('none'); });
  if (!dbDoc) return;
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1200);
}
async function flush(){
  if (!dbDoc) return;
  if (saving) { pendingSave = true; return; }
  saving = true;
  try { await dbDoc.set(JSON.parse(JSON.stringify(S))); setSync('cloud'); }
  catch (e) { setSync('local'); }
  saving = false;
  if (pendingSave) { pendingSave = false; flush(); }
}
async function initStore(){
  try { const raw = localStorage.getItem(LSKEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); localStorage.setItem(LSKEY + '-t', '1'); canLS = true; } catch (e) { canLS = false; }
  try { const raw = await IDB.get(LSKEY); canIDB = true; if (raw) { const st = Object.assign(blank(), JSON.parse(raw)); if (attempts(st) > attempts(S)) S = st; } } catch (e) { canIDB = false; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  setSync(canLS || canIDB ? 'local' : 'none');
  if (!sess) render();
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) return;
    dbDoc = db.doc('data/users/' + uid + '/progress');
    const snap = await dbDoc.get();
    if (snap.exists) {
      const cloud = Object.assign(blank(), JSON.parse(JSON.stringify(snap.data())));
      if (attempts(cloud) >= attempts(S)) S = cloud; else flush();
      try { localStorage.setItem(LSKEY, JSON.stringify(S)); } catch (e) {}
    } else if (attempts(S) > 0) flush();
    setSync('cloud');
    if (!sess) render();
  } catch (e) { setSync('local'); }
}
function record(id, ok, mode){
  const r = S.rec[id] || {n:0, c:0}; r.n++; if (ok) r.c++; r.last = ok ? 1 : 0; r.t = Date.now(); S.rec[id] = r;
  const k = dayKey(new Date()); S.days[k] = (S.days[k] || 0) + 1;
  if (!ok) { const w = S.wrong[id] || {n:0}; w.n++; w.t = Date.now(); S.wrong[id] = w; }
  else if (mode === 'review') delete S.wrong[id];
}

// ---------- 語音（使用裝置內建語音，離線也能播放） ----------
const TTS = window.speechSynthesis || null;
let voice = null, playAll = null;
const vset = {rate:0.9, ex:0};
function pickVoice(){
  if (!TTS) return;
  const vs = TTS.getVoices().filter(v => /^en[-_]/i.test(v.lang) || v.lang === 'en');
  // 優先選「本機語音」(localService)，沒網路也能用
  const local = vs.filter(v => v.localService);
  const pool = local.length ? local : vs;
  voice = pool.find(v => /en[-_]US/i.test(v.lang)) || pool[0] || null;
}
if (TTS) { pickVoice(); TTS.onvoiceschanged = () => { pickVoice(); if (!sess && tab === 'vocab') render(); }; }
function speak(text, onend){
  if (!TTS) { alert('這個瀏覽器不支援語音播放，建議使用 Chrome、Edge 或 Safari。'); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = voice ? voice.lang : 'en-US'; if (voice) u.voice = voice; u.rate = vset.rate;
  if (onend) { u.onend = onend; u.onerror = onend; }
  TTS.speak(u);
}
function say(text){ stopAll(); TTS && TTS.cancel(); speak(text); }
function stopAll(){ if (playAll) { playAll.stop = true; playAll = null; } if (TTS) TTS.cancel(); document.querySelectorAll('tr.playing').forEach(r => r.classList.remove('playing')); const b = $('#playall'); if (b) b.textContent = '▶ 連續播放'; }
function startPlayAll(){
  const words = vocabRows();
  if (!words.length) return;
  stopAll(); TTS.cancel();
  const st = playAll = {i:0, stop:false};
  const b = $('#playall'); if (b) b.textContent = '■ 停止播放';
  const step = () => {
    if (st.stop) return;
    document.querySelectorAll('tr.playing').forEach(r => r.classList.remove('playing'));
    if (st.i >= words.length) { stopAll(); return; }
    const v = words[st.i];
    const row = document.querySelector(`tr[data-w="${CSS.escape(v[0])}"]`);
    if (row) { row.classList.add('playing'); row.scrollIntoView({block:'nearest', behavior:'smooth'}); }
    speak(v[0], () => {
      if (st.stop) return;
      const nxt = () => { st.i++; setTimeout(step, 700); };
      if (vset.ex) setTimeout(() => !st.stop && speak(v[3], nxt), 400); else nxt();
    });
  };
  step();
}
const spk = (text, cls) => `<button class="spk ${cls || ''}" data-act="say" data-say="${esc(text)}" aria-label="播放發音" title="播放發音">▶</button>`;

// ---------- 統計 ----------
function partStats(p){
  const qs = byPart(p); let n = 0, c = 0, done = 0;
  qs.forEach(q => { const r = S.rec[q.id]; if (r) { n += r.n; c += r.c; done++; } });
  return {n, c, done, total:qs.length, acc:pct(c, n)};
}
function streak(){
  let d = new Date(), s = 0;
  if (!S.days[dayKey(d)]) d.setDate(d.getDate() - 1);
  while (S.days[dayKey(d)]) { s++; d.setDate(d.getDate() - 1); }
  return s;
}
const accClass = a => a >= TARGET ? 'ok' : a >= 55 ? 'warn' : 'bad';

// ---------- 題目組合 ----------
function makeItem(id){
  const q = QM[id];
  let opts = q.opts;
  if (q.part === 'V') {
    const others = shuffle(VOC.filter(v => v[2] !== q.ans && v[1].split('/')[0] === q.pos.split('/')[0]).map(v => v[2]));
    const pool = others.length >= 3 ? others : shuffle(VOC.filter(v => v[2] !== q.ans).map(v => v[2]));
    opts = [q.ans, ...pool.slice(0, 3)];
  }
  return {id, opts, order:shuffle([0, 1, 2, 3]), pick:null};
}
function orderPool(ids, pick){
  if (pick === 'wrong') ids = ids.filter(id => S.wrong[id]);
  if (pick === 'star') ids = ids.filter(id => S.star[id]);
  ids = shuffle(ids);
  if (pick === 'new') ids.sort((a, b) => (S.rec[a] ? 1 : 0) - (S.rec[b] ? 1 : 0));
  return ids;
}
function pickPassages(part, count, pick){
  let ps = shuffle(part === 6 ? P6 : P7);
  const qualifies = p => pick === 'wrong' ? p.qids.some(id => S.wrong[id]) : pick === 'star' ? p.qids.some(id => S.star[id]) : true;
  ps = ps.filter(qualifies);
  if (pick === 'new') ps.sort((a, b) => a.qids.filter(id => S.rec[id]).length - b.qids.filter(id => S.rec[id]).length);
  const out = [];
  for (const p of ps) {
    if (count && out.length >= count) break;
    const ids = (pick === 'wrong') ? p.qids.filter(id => S.wrong[id]) : (pick === 'star') ? p.qids.filter(id => S.star[id]) : p.qids;
    out.push(...ids);
  }
  return out;
}
function buildPractice(part, count, pick){
  let ids = [];
  if (part === 5 || part === 'V') { ids = orderPool(byPart(part).map(q => q.id), pick); if (count) ids = ids.slice(0, count); }
  else if (part === 6 || part === 7) ids = pickPassages(part, count, pick);
  else {
    const n = count || 30;
    const p5 = orderPool(byPart(5).map(q => q.id), pick).slice(0, Math.ceil(n / 2));
    ids = [...p5, ...pickPassages(6, Math.round(n * 0.2), pick), ...pickPassages(7, n - p5.length - Math.round(n * 0.2), pick)];
    if (!count) ids = [...orderPool(byPart(5).map(q => q.id), pick), ...pickPassages(6, 0, pick), ...pickPassages(7, 0, pick)];
  }
  return ids;
}
function buildExam(n){
  const p5 = shuffle(byPart(5).map(q => q.id)).slice(0, Math.round(n * 0.5));
  const need6 = Math.round(n * 0.2); const p6 = [];
  for (const p of shuffle(P6)) { if (p6.length >= need6) break; p6.push(...p.qids); }
  const p7 = [];
  for (const p of shuffle(P7)) { if (p5.length + p6.length + p7.length >= n) break; p7.push(...p.qids); }
  return [...p5, ...p6, ...p7];
}

      <button class="btn primary" data-act="again">${r.mode === 'exam' ? '再考一次' : '再練一組'}</button>
      ${items.some(x => x.pick !== x.order.indexOf(0)) ? `<button class="btn" data-act="redowrong">重做本次錯題</button>` : ''}
      <button class="btn ghost" data-act="tohome">回總覽</button>
    </div>
    <div class="card"><h2 style="margin-bottom:8px">逐題檢討</h2><div class="list">
      ${items.map((x, i) => { const q = QM[x.id]; const cp = x.order.indexOf(0); const ok = x.pick === cp; const skipped = x.pick === null;
        return `<details ${!ok && i < 200 ? '' : ''}><summary><span class="mark ${skipped ? 'n' : ok ? 'r' : 'w'}">${skipped ? '–' : ok ? '✓' : '✗'}</span><span class="pill">${PARTS[q.part].name}</span><span class="s">${esc(snippet(q))}</span><span class="muted num" style="font-size:12px">${i + 1}</span></summary>
        <div class="body">${q.pid ? `<div class="muted" style="font-size:13px">${esc(PASS[q.pid].title)}</div>` : ''}
          <div>${esc(q.part === 6 ? '空格 [' + q.num + ']' : q.stem)}</div>
          <div>你的答案：${skipped ? '<span class="muted">未作答</span>' : `<b style="color:var(--${ok ? 'ok' : 'bad'})">(${LET[x.pick]}) ${esc(x.opts[x.order[x.pick]])}</b>`}　正解：<b style="color:var(--ok)">(${LET[cp]}) ${esc(x.opts[0])}</b></div>
          ${explain(q)}</div></details>`; }).join('')}
    </div></div>
  </div>`;
}
function snippet(q){
  if (q.part === 'V') return q.stem + '　' + q.ans;
  if (q.part === 6) return PASS[q.pid].title + ' · 空格 [' + q.num + ']';
  return q.stem;
}

function renderWrong(){
  const filters = [['all', '全部'], ['5', 'Part 5'], ['6', 'Part 6'], ['7', 'Part 7'], ['V', '單字'], ['star', '★ 收藏']];
  const src = wfilter === 'star' ? S.star : S.wrong;
  let ids = Object.keys(src).filter(id => QM[id]);
  if (wfilter !== 'all' && wfilter !== 'star') ids = ids.filter(id => String(QM[id].part) === wfilter);
  ids.sort((a, b) => (src[b].t || 0) - (src[a].t || 0));
  const cnt = f => { const s = f === 'star' ? S.star : S.wrong; return Object.keys(s).filter(id => QM[id] && (f === 'all' || f === 'star' || String(QM[id].part) === f)).length; };
  return `
  <div class="stack" style="padding-top:22px">
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><div class="eyebrow">錯題本</div><h1>把錯過的題目刷到會</h1></div>
      <button class="btn primary" data-act="reviewfilter" ${ids.length ? '' : 'disabled'}>${wfilter === 'star' ? '練習收藏題' : '重做這些錯題'}（${ids.length}）</button>
    </div>
    <div class="seg">${filters.map(([f, l]) => `<button data-act="wfilter" data-val="${f}" aria-pressed="${wfilter === f}">${l} <span class="num muted">${cnt(f)}</span></button>`).join('')}</div>
    <div class="card">
      ${ids.length ? `<div class="list">${ids.map(id => { const q = QM[id]; const w = S.wrong[id]; const r = S.rec[id];
        return `<details><summary><span class="mark ${w ? 'w' : 'n'}">${w ? '✗' : '★'}</span><span class="pill">${PARTS[q.part].name}</span><span class="s">${esc(snippet(q))}</span><span class="muted" style="font-size:12px;white-space:nowrap">${w ? '錯 ' + w.n + ' 次' : ''}${r ? ' · 對 ' + r.c + '/' + r.n : ''}</span></summary>
        <div class="body">${q.pid ? `<details><summary style="display:block;padding:0;color:var(--accent);font-size:13px">展開文章：${esc(PASS[q.pid].title)}</summary><div class="passage" style="margin-top:8px">${passageHtml(PASS[q.pid], q.part === 6 ? q.num : null)}</div></details>` : ''}
          <div>${esc(q.part === 6 ? '空格 [' + q.num + ']' : q.stem)}</div>
          <div>正解：<b style="color:var(--ok)">${esc(q.part === 'V' ? q.ans : q.opts[0])}</b></div>
          ${explain(q)}
          <div class="row">${w ? `<button class="btn" data-act="unwrong" data-id="${id}">已學會，移出錯題本</button>` : ''}<button class="btn ghost" data-act="unstar" data-id="${id}">${S.star[id] ? '取消收藏' : '加入收藏'}</button></div>
        </div></details>`; }).join('')}</div>`
      : `<div class="empty">${wfilter === 'star' ? '還沒有收藏的題目。作答時點右上角的 ☆ 就能收藏。' : '這裡目前沒有錯題。去練習區刷幾題吧！'}</div>`}
    </div>
    <div class="muted" style="font-size:13px">在「錯題複習」中答對的題目會自動移出錯題本；一般練習答對則保留，方便再確認一次。</div>
  </div>`;
}

function renderVocab(){
  const s = partStats('V');
  const n = vsetup.count || VOC.length;
  const ids = orderPool(byPart('V').map(q => q.id), vsetup.pick).slice(0, n);
  const rows = vocabRows();
  return `
  <div class="stack" style="padding-top:22px">
    <div><div class="eyebrow">核心單字 · ${VOC.length} 字</div><h1>多益高頻商務單字</h1></div>
    <div class="card stack">
      <div class="grid g2">
        <div class="field"><div class="lab">數量</div>${segBtns('count', 'vsetup', [[10, '10 字'], [20, '20 字'], [0, '全部']])}</div>
        <div class="field"><div class="lab">出題方式</div>${segBtns('pick', 'vsetup', [['new', '沒背過的優先'], ['rand', '隨機'], ['wrong', '只考錯的']])}</div>
      </div>
      <div class="row" style="justify-content:space-between">
        <span class="muted">已練習 <b class="num">${s.done}</b> / ${s.total} 字${s.n ? ' · 答對率 <b class="num">' + s.acc + '%</b>' : ''}</span>
        <button class="btn primary" data-act="startvocab" ${ids.length ? '' : 'disabled'}>${ids.length ? `開始測驗（${ids.length} 字）` : '目前沒有答錯的單字'}</button>
      </div>
    </div>
    <div class="card stack">
      <div class="row" style="justify-content:space-between"><h2>單字表</h2><input type="search" id="vq" placeholder="搜尋英文或中文" value="${esc(vsetup.q)}" aria-label="搜尋單字"></div>
      ${TTS ? `<div class="row" style="gap:12px;flex-wrap:wrap">
        <button class="btn primary" id="playall" data-act="playall">${playAll ? '■ 停止播放' : '▶ 連續播放'}</button>
        <div class="field"><div class="lab">語速</div>${segBtns('rate', 'vset', [[0.7, '慢'], [0.9, '正常'], [1.1, '快']])}</div>
        <div class="field"><div class="lab">連播內容</div>${segBtns('ex', 'vset', [[0, '只唸單字'], [1, '單字＋例句']])}</div>
      </div>
      ${voice ? `<div class="muted" style="font-size:12px">使用語音：${esc(voice.name)}${voice.localService ? '（本機語音，離線可用）' : '（此語音可能需要網路）'}</div>` : '<div class="warnbox">找不到英文語音。請到系統設定安裝英文語音（Windows：設定 › 時間與語言 › 語音；iPhone：設定 › 輔助使用 › 朗讀內容 › 聲音）。</div>'}`
      : '<div class="warnbox">這個瀏覽器不支援語音播放，建議使用 Chrome、Edge 或 Safari 開啟。</div>'}
      <div class="tbl-wrap"><table id="vtbl"><thead><tr><th>單字</th><th>詞性</th><th>中文</th><th>例句</th><th>狀態</th></tr></thead><tbody id="vbody">
        ${vocabRowsHtml(rows)}
      </tbody></table></div>
    </div>
  </div>`;
}

function vocabRows(){
  const qstr = vsetup.q.trim().toLowerCase();
  return VOC.filter(v => !qstr || v[0].toLowerCase().includes(qstr) || v[2].includes(vsetup.q.trim()));
}
function vocabRowsHtml(rows){
  return rows.map(v => { const id = 'v-' + v[0]; const r = S.rec[id]; return `<tr data-w="${esc(v[0])}"><td class="num"><div class="wcell">${TTS ? spk(v[0]) : ''}<b>${esc(v[0])}</b></div></td><td class="muted">${esc(v[1])}</td><td>${esc(v[2])}</td><td>${TTS ? spk(v[3], 'sm') + ' ' : ''}${esc(v[3])}<div class="muted" style="font-size:13px">${esc(v[4])}</div></td><td>${S.wrong[id] ? '<span class="pill bad">待加強</span>' : r ? '<span class="pill ok">答對過</span>' : '<span class="pill">未練習</span>'}</td></tr>`; }).join('') || '<tr><td colspan="5" class="muted">找不到符合的單字</td></tr>';
}

// ---------- 作答流程 ----------
function pick(pos){
  const s = sess; const it = s.items[s.i];
  if (s.mode === 'exam') { it.pick = pos; render(); return; }
  if (it.pick !== null) return;
  it.pick = pos; s.showZh = false;
  record(it.id, pos === it.order.indexOf(0), s.mode); save();
  render();
}
function next(){
  const s = sess;
  if (s.mode === 'exam') { if (s.i < s.items.length - 1) { s.i++; render(); scrollQ(); } else { confirmSubmit = true; render(); } return; }
  if (s.i < s.items.length - 1) { s.i++; s.showZh = false; render(); scrollQ(); }
  else finishPractice();
}
function scrollQ(){ const q = QM[sess.items[sess.i].id]; const prev = sess.i > 0 ? QM[sess.items[sess.i - 1].id] : null; if (!q.pid || !prev || prev.pid !== q.pid) window.scrollTo(0, 0); }
function finishPractice(){
  const s = sess; const answered = s.items.filter(x => x.pick !== null);
  sess = null;
  if (!answered.length) { render(); return; }
  view = {mode:s.mode, items:answered, part:s.part, count:s.count, pick:s.pick, kind:s.kind};
  render(); window.scrollTo(0, 0);
}
function startTimer(){
  stopTimer();
  sess.limit = sess.items.length * 45; sess.left = sess.limit;
  timerId = setInterval(() => {
    if (!sess || sess.mode !== 'exam') { stopTimer(); return; }
    sess.left = sess.limit - Math.floor((Date.now() - sess.start) / 1000);
    const el = $('#timer');
    if (el) { el.textContent = fmtTime(Math.max(0, sess.left)); el.classList.toggle('low', sess.left <= 60); }
    if (sess.left <= 0) submitExam(true);
  }, 1000);
}
function stopTimer(){ if (timerId) clearInterval(timerId); timerId = null; }
function submitExam(timeout){
  stopTimer();
  const s = sess; const sec = Math.min(s.limit, Math.round((Date.now() - s.start) / 1000));
  s.items.forEach(x => record(x.id, x.pick === x.order.indexOf(0), 'exam'));
  const c = s.items.filter(x => x.pick === x.order.indexOf(0)).length;
  S.exams = (S.exams || []).concat([{d:dayKey(new Date()), n:s.items.length, c, sec}]).slice(-30);
  save();
  sess = null; confirmSubmit = false;
  view = {mode:'exam', items:s.items, sec, timeout:!!timeout, n:s.n};
  render(); window.scrollTo(0, 0);
}

// ---------- 事件 ----------
document.addEventListener('click', e => {
  const b = e.target.closest('[data-tab],[data-act]'); if (!b || b.disabled) return;
  if (b.dataset.tab) { go(b.dataset.tab); return; }
  const a = b.dataset.act;
  switch (a) {
    case 'say': say(b.dataset.say); break;
    case 'playall': if (playAll) stopAll(); else startPlayAll(); break;
    case 'export': exportData(); break;
    case 'import': { const f = $('#importfile'); if (f) f.click(); break; }
    case 'set': { const o = ({setup, vsetup, esetup, vset})[b.dataset.obj]; let v = b.dataset.val; if (/^\d+(\.\d+)?$/.test(v)) v = +v; o[b.dataset.key] = v; if (b.dataset.obj === 'vsetup') stopAll();
      if (b.dataset.key === 'part') setup.count = (v === 6 || v === 7) ? 2 : 10; render(); break; }
    case 'quick': startSession('practice', buildPractice(5, 10, 'new'), {part:5, count:10, pick:'new', kind:'practice'}); tab = 'practice'; break;
    case 'goexam': go('exam'); break;
    case 'tohome': go('home'); break;
    case 'reviewall': { const ids = sortIds(Object.keys(S.wrong).filter(id => QM[id])); tab = 'wrong'; startSession('review', ids, {kind:'review'}); break; }
    case 'startpractice': startSession('practice', buildPractice(setup.part, setup.count, setup.pick), {part:setup.part, count:setup.count, pick:setup.pick, kind:'practice'}); break;
    case 'startvocab': startSession(vsetup.pick === 'wrong' ? 'review' : 'practice', orderPool(byPart('V').map(q => q.id), vsetup.pick).slice(0, vsetup.count || VOC.length), {kind:'vocab'}); break;
    case 'startexam': startSession('exam', buildExam(esetup.n), {n:esetup.n}); break;
    case 'pick': pick(+b.dataset.pos); break;
    case 'next': next(); break;
    case 'skip': if (sess.i < sess.items.length - 1) { sess.i++; render(); scrollQ(); } else finishPractice(); break;
    case 'prev': if (sess.i > 0) { sess.i--; render(); scrollQ(); } break;
    case 'jump': sess.i = +b.dataset.i; render(); window.scrollTo(0, 0); break;
    case 'endpractice': finishPractice(); break;
    case 'togglezh': sess.showZh = !sess.showZh; render(); break;
    case 'star': { const id = sess.items[sess.i].id; if (S.star[id]) delete S.star[id]; else S.star[id] = {t:Date.now()}; save(); render(); break; }
    case 'unstar': { const id = b.dataset.id; if (S.star[id]) delete S.star[id]; else S.star[id] = {t:Date.now()}; save(); render(); break; }
    case 'unwrong': delete S.wrong[b.dataset.id]; save(); render(); break;
    case 'wfilter': wfilter = b.dataset.val; render(); break;
    case 'reviewfilter': {
      const src = wfilter === 'star' ? S.star : S.wrong;
      let ids = Object.keys(src).filter(id => QM[id]);
      if (wfilter !== 'all' && wfilter !== 'star') ids = ids.filter(id => String(QM[id].part) === wfilter);
      startSession(wfilter === 'star' ? 'practice' : 'review', sortIds(ids), {kind:'review'}); break; }
    case 'asksubmit': confirmSubmit = true; confirmQuit = false; render(); break;
    case 'askquit': confirmQuit = true; confirmSubmit = false; render(); break;
    case 'cancelconfirm': confirmSubmit = confirmQuit = false; render(); break;
    case 'submit': submitExam(false); break;
    case 'quit': stopTimer(); sess = null; confirmQuit = false; render(); break;
    case 'again': {
      const r = view; view = null;
      if (r.mode === 'exam') startSession('exam', buildExam(r.n || esetup.n), {n:r.n || esetup.n});
      else if (r.kind === 'vocab') startSession('practice', orderPool(byPart('V').map(q => q.id), vsetup.pick === 'wrong' ? 'new' : vsetup.pick).slice(0, vsetup.count || VOC.length), {kind:'vocab'});
      else if (r.kind === 'review') { const ids = sortIds(Object.keys(S.wrong).filter(id => QM[id])); if (ids.length) startSession('review', ids, {kind:'review'}); else render(); }
      else startSession('practice', buildPractice(r.part, r.count, r.pick === 'wrong' ? 'new' : r.pick), {part:r.part, count:r.count, pick:r.pick, kind:'practice'});
      break; }
    case 'redowrong': { const ids = view.items.filter(x => x.pick !== x.order.indexOf(0)).map(x => x.id); view = null; startSession('review', ids, {kind:'review'}); break; }
  }
});
async function exportData(){
  const name = '多益650紀錄-' + dayKey(new Date()) + '.json';
  try { const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) { try { await dl.save({filename:name, data:JSON.stringify(S)}); } catch (e) { if (e && e.code !== 'declined') alert('下載失敗，請稍後再試'); } return; } } catch (e) {}
  const blob = new Blob([JSON.stringify(S)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
document.addEventListener('change', e => {
  if (e.target.id !== 'importfile' || !e.target.files[0]) return;
  const rd = new FileReader();
  rd.onload = () => {
    try { const d = JSON.parse(rd.result); if (!d || typeof d.rec !== 'object') throw 0;
      if (!confirm('要用備份檔取代目前的紀錄嗎？')) return;
      S = Object.assign(blank(), d); save(); if (dbDoc) flush(); render(); alert('已還原紀錄');
    } catch (err) { alert('備份檔格式不正確'); }
  };
  rd.readAsText(e.target.files[0]); e.target.value = '';
});
function sortIds(ids){
  const rank = q => q.part === 5 ? 0 : q.part === 6 ? 1 : q.part === 7 ? 2 : 3;
  return ids.slice().sort((a, b) => { const qa = QM[a], qb = QM[b]; return rank(qa) - rank(qb) || Q.indexOf(qa) - Q.indexOf(qb); });
}
document.addEventListener('input', e => {
  if (e.target.id === 'vq') {
    vsetup.q = e.target.value;
    stopAll();
    const body = $('#vbody');
    if (body) body.innerHTML = vocabRowsHtml(vocabRows());
  }
});
document.addEventListener('keydown', e => {
  if (!sess || e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const idx = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
  if (idx >= 0 && k.length === 1) { const it = sess.items[sess.i]; if (sess.mode === 'exam' || it.pick === null) { e.preventDefault(); pick(idx); } }
  else if (k === 'enter' || k === 'arrowright') {
    const it = sess.items[sess.i];
    if (sess.mode === 'exam' || it.pick !== null) { if (document.activeElement && document.activeElement.tagName === 'BUTTON' && k === 'enter') return; e.preventDefault(); next(); }
  } else if (k === 'arrowleft' && sess.mode === 'exam' && sess.i > 0) { sess.i--; render(); }
});

render();
initStore();
})();

</script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
